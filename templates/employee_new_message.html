<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New message | SkillPath AI</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/reference-theme.css') }}"></head><body><main class="main-content"><header class="topbar"><div class="crumb"><a href="{{ url_for('employee_messages') }}" class="muted"><i class="bi bi-arrow-left"></i> Messages</a></div><div class="top-actions"><a class="btn btn-light btn-sm" href="{{ url_for('logout') }}">Sign out</a></div></header><div class="page-content"><div class="page-heading"><div><span class="eyebrow">EMPLOYEE COMMUNICATION</span><h1>New Message</h1><p class="muted">Send a message to HR or a colleague.</p></div></div>{% with alerts = get_flashed_messages(with_categories=true) %}{% for category, text in alerts %}<div class="alert alert-{{ category }}" role="alert">{{ text }}</div>{% endfor %}{% endwith %}<section class="panel form-panel" style="max-width:760px"><form method="post">
  <label>Send to</label>
  <div class="d-flex gap-2 mb-3" id="recipient-tabs">
    <button type="button" class="btn btn-primary flex-fill" id="tab-hr" onclick="switchTo('hr')"><i class="bi bi-person-badge me-1"></i>HR Manager</button>
    <button type="button" class="btn btn-outline-secondary flex-fill" id="tab-emp" onclick="switchTo('employee')"><i class="bi bi-person me-1"></i>Employee (by email)</button>
  </div>
  <input type="hidden" name="recipient_type" id="recipient_type" value="{{ form.get('recipient_type', 'hr') }}">
  <div id="emp-email-field" class="mb-3 d-none">
    <label for="recipient_email">Recipient employee email</label>
    <input id="recipient_email" name="recipient_email" type="email" value="{{ form.get('recipient_email', '') }}" placeholder="colleague@skillpath.demo">
  </div>
  <label class="mt-2" for="subject">Subject</label>
  <input id="subject" name="subject" value="{{ form.get('subject', '') }}" maxlength="160" required>
  <label class="mt-3" for="message">Message</label>
  <textarea id="message" name="message" rows="7" maxlength="5000" required>{{ form.get('message', '') }}</textarea>
  <div class="d-flex justify-content-end gap-2 mt-4">
    <a class="btn btn-light" href="{{ url_for('employee_messages') }}">Cancel</a>
    <button class="btn btn-primary" type="submit"><i class="bi bi-send"></i> Send message</button>
  </div>
</form></section></div></main>
<script>
function switchTo(type) {
  document.getElementById('recipient_type').value = type;
  const isEmp = type === 'employee';
  document.getElementById('tab-hr').className = isEmp ? 'btn btn-outline-secondary flex-fill' : 'btn btn-primary flex-fill';
  document.getElementById('tab-emp').className = isEmp ? 'btn btn-primary flex-fill' : 'btn btn-outline-secondary flex-fill';
  document.getElementById('emp-email-field').classList.toggle('d-none', !isEmp);
  document.getElementById('recipient_email').required = isEmp;
}
if (document.getElementById('recipient_type').value === 'employee') switchTo('employee');
</script>
</body></html>
