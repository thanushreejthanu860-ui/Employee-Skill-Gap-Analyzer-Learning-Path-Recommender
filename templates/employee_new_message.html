<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New message | SkillPath AI</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/reference-theme.css') }}"></head><body><main class="main-content"><header class="topbar"><div class="crumb"><i class="bi bi-chat-left-text-fill crumb-home"></i><strong>New message</strong></div></header><div class="page-content"><div class="page-heading"><div><span class="eyebrow">EMPLOYEE COMMUNICATION</span><h1>Message HR</h1><p class="muted">Ask your HR team about your development journey.</p></div></div>{% with alerts = get_flashed_messages(with_categories=true) %}{% for category, text in alerts %}<div class="alert alert-{{ category }}" role="alert">{{ text }}</div>{% endfor %}{% endwith %}<section class="panel form-panel" style="max-width:760px"><form method="post"><label for="recipient">Recipient</label><select id="recipient" name="recipient" required><option value="hr">HR Manager</option></select><label class="mt-3" for="subject">Subject</label><input id="subject" name="subject" value="{{ form.get('subject', '') }}" maxlength="160" required><label class="mt-3" for="message">Message</label><textarea id="message" name="message" rows="7" maxlength="5000" required>{{ form.get('message', '') }}</textarea><div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-light" href="{{ url_for('employee_messages') }}">Cancel</a><button class="btn btn-primary" type="submit"><i class="bi bi-send"></i> Send message</button></div></form></section></div></main></body></html>
