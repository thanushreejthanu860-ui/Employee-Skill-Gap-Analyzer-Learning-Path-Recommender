<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Message | SkillPath AI</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/reference-theme.css') }}"></head><body><main class="main-content"><header class="topbar"><div class="crumb"><a href="{{ url_for('employee_messages') }}" class="muted"><i class="bi bi-arrow-left"></i> Messages</a></div><a class="btn btn-light btn-sm" href="{{ url_for('logout') }}">Sign out</a></header><div class="page-content"><section class="panel" style="max-width:820px"><span class="eyebrow">{{ message.sender_name }}</span><h1>{{ message.subject }}</h1><p class="muted">{{ message.created_at }} · {% if message.is_read %}Read{% else %}Unread{% endif %}</p><hr><p style="white-space:pre-wrap">{{ message.message }}</p></section></div></main></body></html>
