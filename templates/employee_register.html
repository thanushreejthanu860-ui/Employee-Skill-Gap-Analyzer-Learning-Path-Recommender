<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | SkillPath AI</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body class="login-page">
<div class="login-art">
  <div class="brand light"><span class="brand-mark">S</span><span>SkillPath <b>AI</b></span></div>
  <div class="login-copy"><span class="eyebrow">EMPLOYEE PORTAL</span><h1>Start your <em>development journey.</em></h1><p>Create your account and connect with your HR team.</p></div>
  <div class="login-orbit"></div>
</div>
<div class="login-panel"><div class="login-form">
  <span class="eyebrow">NEW EMPLOYEE</span>
  <h2>Create your account</h2>
  {% if error %}<div class="alert alert-danger py-2 mt-3" role="alert"><i class="bi bi-exclamation-circle me-1"></i>{{ error }}</div>{% endif %}
  <form method="post" class="mt-4">
    <label for="name">Full name</label>
    <input id="name" name="name" type="text" value="{{ form.get('name','') }}" required>
    <label for="email" class="mt-3">Your email</label>
    <input id="email" name="email" type="email" value="{{ form.get('email','') }}" placeholder="you@example.com" required>
    <label for="department" class="mt-3">Department</label>
    <input id="department" name="department" type="text" value="{{ form.get('department','') }}" required>
    <label for="password" class="mt-3">Password</label>
    <input id="password" name="password" type="password" required>
    <button class="btn btn-primary w-100 mt-4" type="submit">Create account <i class="bi bi-arrow-right"></i></button>
  </form>
  <small class="muted d-block text-center mt-4">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></small>
</div></div>
</body></html>
