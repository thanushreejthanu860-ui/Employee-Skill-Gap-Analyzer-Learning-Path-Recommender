<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account settings | SkillPath AI</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/reference-theme.css') }}"></head><body><main class="main-content"><header class="topbar"><div class="crumb"><a href="{{ url_for('employee_dashboard') }}" class="muted"><i class="bi bi-arrow-left"></i> Dashboard</a></div><div class="top-actions"><div class="user-profile"><div class="avatar">{{ employee.name[:1] }}{{ employee.name.split()[-1][:1] }}</div><div><strong>{{ employee.name }}</strong><small>{{ employee.email }}</small></div></div><a class="btn btn-light btn-sm" href="{{ url_for('logout') }}">Sign out</a></div></header><div class="page-content"><div class="page-heading"><div><span class="eyebrow">ACCOUNT</span><h1>Account Settings</h1><p class="muted">Update your login email and password.</p></div></div>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}{% if success %}<div class="alert alert-success">{{ success }}</div>{% endif %}<section class="panel form-panel" style="max-width:520px"><form method="post"><label for="email">Your email (used to log in)</label><input id="email" name="email" type="email" value="{{ employee.email }}" required><label class="mt-3" for="password">New password <small class="muted">(leave blank to keep current)</small></label><input id="password" name="password" type="password" placeholder="Enter new password"><div class="d-flex justify-content-end gap-2 mt-4"><a class="btn btn-light" href="{{ url_for('employee_dashboard') }}">Cancel</a><button class="btn btn-primary" type="submit"><i class="bi bi-check2"></i> Save changes</button></div></form></section></div></main></body></html>
